<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ian's Passenger Counter</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="counter">
        <p>NEW YORK SUBWAY</p>
        <h1>People entered:</h1>
        <h2 id="count-el" aria-live="polite">0</h2>
        <button id="increment-btn" type="button" onclick="increment()">INCREMENT</button>
        <button id="save-btn" type="button" onclick="save()">SAVE</button>
        <p id="save-el" aria-live="polite">Previous entries: </p>
        <p class="note">My first JavaScript app — Ian</p>
        <p class="note">Save a group, then count the next one. Refreshing clears the counts.</p>
    </div>
    <script src="index.js"></script>
</body>
</html>
